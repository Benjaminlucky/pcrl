[build]
  command = "npm run build"
  publish = "dist" # or "build" — depends on Vite vs CRA

# Serve the always-up-to-date sitemap from the API (includes blog posts,
# events and pages created in the dashboard). Must come before the SPA
# catch-all below. force = true overrides public/sitemap.xml.
# !! Points at the API on Railway. After moving the API to DirectAdmin, change
# this to https://api.pcrginitiative.com/sitemap.xml and redeploy.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://pcrl-production.up.railway.app/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
