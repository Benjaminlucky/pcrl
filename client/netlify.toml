[build]
  command = "npm run build"
  publish = "dist" # or "build" — depends on Vite vs CRA

# Serve the always-up-to-date sitemap from the API (includes blog posts,
# events and pages created in the dashboard). If the API goes down, comment
# this out to fall back to public/sitemap.xml.
# It must stay before the SPA catch-all below.
[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.pcrginitiative.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
